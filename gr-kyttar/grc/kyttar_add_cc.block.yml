id: kyttar_add_cc
label: Kyttar Add CC
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Add CC — elementwise sum of two COMPLEX streams (drop-in for GNU
  Radio's blocks.add_cc). out = in0 + in1.

  On the Kyttar chip this maps to AddCCBlock: two cells, one saturating Q15
  add per rail (yi = sat(ai + bi), yq = sat(aq + bq)); the two source packets
  are paired per sample by the landing cell's counting join, in any arrival
  order. An out-of-range rail SATURATES to full scale (never wraps).

  num_inputs is pinned to 2 — a HARDWARE LIMIT (a third complex stream does
  not fit the 32-word landing cell).

  Place it between two complex sources and a KyttarSink and ensure the
  device_id matches your KyttarDevice.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.add_cc(device_id=${device_id}, num_inputs=${num_inputs})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'
- id: num_inputs
  label: Num Inputs
  dtype: int
  default: '2'

inputs:
- label: in
  domain: stream
  dtype: complex
  multiplicity: ${ num_inputs }

outputs:
- label: out
  domain: stream
  dtype: complex

asserts:
- ${ num_inputs == 2 }

file_format: 1
