id: kyttar_agc
label: 🧪 Kyttar AGC
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  🧪 NOT YET VERIFIED: this block is queued for GNU Radio-equivalence
  verification but hasn't been validated yet. Use with care.

  Kyttar AGC - Automatic Gain Control (mirrors GNU Radio analog.agc_ff VERBATIM)

  GNU Radio's float AGC loop:
      output  = input * gain
      gain   += rate * (reference - |output|)
      if max_gain > 0: gain = min(gain, max_gain)

  This block runs on the Kyttar chip. Place it between a KyttarSource
  and KyttarSink block, and ensure the device_id matches your KyttarDevice.

  Parameters (GR analog.agc_ff verbatim):
  - Device ID: ID of the KyttarDevice block
  - Rate: update rate of the loop (GR default 1e-4)
  - Reference: reference value to adjust signal power to (GR default 1.0)
  - Gain: initial gain value (GR default 1.0)
  - Max Gain: maximum gain; 0 = unlimited (GR default 0)

  The AGC automatically adjusts gain to maintain the reference level,
  useful for handling signals with varying amplitude.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.agc(device_id=${device_id}, rate=${rate}, reference=${reference}, gain=${gain}, max_gain=${max_gain})
  callbacks:
    - set_reference(${reference})
    - set_rate(${rate})
    - set_gain(${gain})
    - set_max_gain(${max_gain})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'
  - id: rate
    label: Rate
    dtype: real
    default: 1e-4
  - id: reference
    label: Reference
    dtype: real
    default: 1.0
  - id: gain
    label: Gain
    dtype: real
    default: 1.0
  - id: max_gain
    label: Max Gain
    dtype: real
    default: 0.0

inputs:
  - label: in
    dtype: float

outputs:
  - label: out
    dtype: float

file_format: 1
