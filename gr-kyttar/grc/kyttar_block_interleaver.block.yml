id: kyttar_block_interleaver
label: Kyttar Block Interleaver
category: '[Kyttar]/FEC'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.block_interleaver(${device_id}, ${rows}, ${cols}, ${deinterleave})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: rows
  label: Rows
  dtype: int
  default: '2'

- id: cols
  label: Columns
  dtype: int
  default: '2'

- id: deinterleave
  label: Mode
  dtype: enum
  options: ['False', 'True']
  option_labels: ['Interleave', 'Deinterleave']
  default: 'False'

inputs:
- label: in
  domain: stream
  dtype: float

outputs:
- label: out
  domain: stream
  dtype: float

documentation: |-
  Classic rows x cols BLOCK (matrix) interleaver / deinterleaver for FEC
  chains. No stock GNU Radio streaming counterpart (the gr-fec / gr-dtv
  interleavers are PDU/tagged); the reference is the standard row-column
  interleaver of the coding literature (Sklar, Digital Communications, ch. 8;
  Lin & Costello, Error Control Coding).

  WRITE/READ ORDER: each block of rows*cols symbols is written into the
  matrix ROW BY ROW (arrival order) and read out COLUMN BY COLUMN.
  Deinterleave mode applies the exact inverse (transpose) permutation, so
  interleave -> deinterleave restores the stream. One machinery, both
  directions.

  RATE / LATENCY: strict 1:1 (one output sample per input sample) with a
  group delay of exactly rows*cols samples (the block is double-buffered:
  while block b streams in, block b-1 streams out permuted). The first
  rows*cols outputs are zeros.

  Burst-error dispersion (the FEC property): a channel burst spanning at
  most `rows` consecutive interleaved symbols corrupts AT MOST ONE symbol in
  each row (each cols-long codeword) after deinterleaving — a
  single-error-correcting row code then heals the whole burst.

  Example (2x3 interleave):
    Input order:   0 1 2 3 4 5
    Matrix:        [0 1 2]   (row 0)
                   [3 4 5]   (row 1)
    Output order:  0 3 1 4 2 5

  Hardware limit: rows*cols <= 12 (the double buffer must fit one 32-word
  cell); a larger matrix is rejected at placement. Deeper (FEC-realistic)
  matrices are the SRAM-panel growth path, not yet implemented.

  Ports:
    in  (float): sample stream (any Q15 payload — bits, symbols, samples)
    out (float): interleaved/deinterleaved stream, delayed rows*cols samples

  Parameters:
    Device ID: Which Kyttar device to use
    Rows: matrix rows (burst tolerance in channel symbols)
    Columns: matrix columns (codeword span)
    Mode: Interleave (write rows / read columns) or Deinterleave (inverse)

file_format: 1
