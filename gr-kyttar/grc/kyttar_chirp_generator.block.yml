id: kyttar_chirp_generator
label: Chirp Generator (CSS)
category: '[Kyttar]/Modulators'
flags: [ python ]

documentation: |-
  Kyttar Chirp Generator — the chirp-spread-spectrum (CSS) symbol modulator.
  There is NO stock GNU Radio streaming counterpart, so this is a
  placeKYT-native ([Kyttar]) block (Python golden, chip bit-exact).

  For each input word s (a RAW symbol word in 0..M-1) it emits N complex
  samples of a linear UP-chirp whose instantaneous frequency starts at
  f(s) = (s/M - 1/2)*BW and sweeps upward by BW over the N samples, WRAPPING
  (mod BW) at +BW/2 — the standard cyclic-shifted chirp. BW is the full
  digital bandwidth (the sample rate). The cyclic shift encodes the symbol; a
  dechirp + N-point FFT + argmax recovers it.

  Implementation: a double phase accumulator in 16-bit wrap arithmetic — the
  per-symbol frequency word s*(65536/M) + 0x8000 increments by 65536/N each
  sample, and the natural 16-bit wraparound IS the mod-BW cyclic shift —
  feeding the verified NCO quarter-wave sine table with linear interpolation.
  The phase accumulator CARRIES across symbols (phase-continuous TX; pinned
  and gated). Rate-EXPANDING: 1 input word -> N complex samples.

  The input is a RAW symbol word (0..M-1, dtype short — e.g. the Chirp Symbol
  Mapper's output), NOT a Q15 sample.

  This block runs on the Kyttar chip. Place it between a KyttarSource and
  KyttarSink block, and ensure the device_id matches your KyttarDevice.

  Parameters:
  - Device ID: ID of the KyttarDevice block
  - N: samples per chirp symbol; MUST be a power of two in [2, 65536]
    (verified 16..256). Chirp rate = BW/N per sample. Other values raise.
  - M: symbol alphabet size; MUST be a power of two with 2 <= M <= N (the
    classic LoRa-style configuration is M == N). Other values raise.
  - Amplitude: output amplitude 0..1 (a Q15 gain), default 1.0.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.chirp_generator(device_id=${device_id}, n=${n}, m=${m}, amplitude=${amplitude})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'
  - id: n
    label: N (samples per symbol)
    dtype: int
    default: '128'
  - id: m
    label: M (alphabet size)
    dtype: int
    default: '128'
  - id: amplitude
    label: Amplitude
    dtype: real
    default: '1.0'

inputs:
  - label: in
    dtype: short

outputs:
  - label: out
    dtype: complex

file_format: 1
