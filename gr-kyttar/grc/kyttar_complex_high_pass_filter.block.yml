id: kyttar_complex_high_pass_filter
label: Complex High Pass Filter
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Complex High Pass Filter — drop-in for fir_filter_ccf fed firdes.high_pass
  taps. Complex (I/Q) in, complex out; ONE shared real tap set on both rails.
  Runs on the Kyttar chip (place between KyttarSource and KyttarSink).

  HARDWARE NOTE: a wide (multi-cell) complex filter needs Sum|h| <= 1; a high_pass
  at gain=1.0 can exceed it, so the default gain is 0.5 (the placeKYT block raises a
  clear error if a multi-cell filter has Sum|h| > 1). Correlation is gain-invariant.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.complex_high_pass_filter(device_id=${device_id}, gain=${gain}, samp_rate=${samp_rate},
    cutoff_freq=${cutoff_freq}, transition_width=${transition_width}, window=${window}, beta=${beta})
  callbacks:
    - set_cutoff_freq(${cutoff_freq})
    - set_transition_width(${transition_width})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'
  - id: gain
    label: Gain
    dtype: real
    default: '0.5'
  - id: samp_rate
    label: Sample Rate
    dtype: real
    default: samp_rate
  - id: cutoff_freq
    label: Cutoff Freq
    dtype: real
    default: '4000'
  - id: transition_width
    label: Transition Width
    dtype: real
    default: '2000'
  - id: window
    label: Window
    dtype: string
    default: '"hamming"'
    options: ['"hamming"', '"hann"', '"blackman"', '"rectangular"', '"blackman_harris"', '"kaiser"']
    option_labels: [Hamming, Hann, Blackman, Rectangular, Blackman-harris, Kaiser]
  - id: beta
    label: Beta
    dtype: real
    default: '6.76'

inputs:
  - label: in
    dtype: complex

outputs:
  - label: out
    dtype: complex

file_format: 1
