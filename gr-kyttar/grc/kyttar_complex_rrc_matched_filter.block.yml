id: kyttar_complex_rrc_matched_filter
label: Kyttar Complex RRC Matched Filter
category: '[Kyttar]'
flags: [ python ]

templates:
  imports: from gnuradio import kyttar
  make: kyttar.complex_rrc_matched_filter(device_id=${device_id}, gain=${gain}, samp_rate=${samp_rate},
    sym_rate=${sym_rate}, alpha=${alpha}, ntaps=${ntaps}, decimation=${decimation})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: gain
  label: Gain
  dtype: real
  default: '0.7105'

- id: samp_rate
  label: Sample Rate (Hz)
  dtype: real
  default: '2.0'

- id: sym_rate
  label: Symbol Rate (Hz)
  dtype: real
  default: '1.0'

- id: alpha
  label: Roll-off (alpha)
  dtype: real
  default: '0.35'

- id: ntaps
  label: Num Taps
  dtype: int
  default: '17'

- id: decimation
  label: Decimation
  dtype: int
  default: '1'

inputs:
- label: in
  domain: stream
  dtype: complex

outputs:
- label: out
  domain: stream
  dtype: complex

documentation: |-
  Complex RRC Matched Filter — drop-in for GNU Radio's filter.fir_filter_ccf fed
  taps from filter.firdes.root_raised_cosine(gain, samp_rate, sym_rate, alpha,
  ntaps). Complex (I/Q) baseband in, complex out: ONE shared real sqrt-RRC tap set
  filters BOTH rails (exactly fir_filter_ccf). The RX matched-filter front end;
  together with the transmit sqrt-RRC pulse shaper it forms a raised-cosine Nyquist
  response (zero ISI) — the optimal-SNR linear filter for the known pulse in AWGN.

  This block runs on the Kyttar chip. Place it between a KyttarSource and
  KyttarSink; the device_id must match your KyttarDevice.

  Parameters (mirroring GNU Radio's firdes.root_raised_cosine VERBATIM):
    Device ID: which Kyttar device to use.
    Gain:      passband gain (RRC taps normalised so their SUM = gain). Default
               0.7105 keeps the Q15 datapath in range for the default shape;
               matched-filtering is gain-invariant for the downstream carrier/
               timing loops (Costas normalises amplitude).
    Sample Rate / Symbol Rate: samples-per-symbol = samp_rate / sym_rate.
    alpha:     RRC roll-off / excess bandwidth (0.2-0.5 typical; 0.35 default).
    Num Taps:  filter length (forced ODD, like GR). <= 32 (the fold stays <=8 cells
               across the 10x12 chip; larger raises a clear error).
    Decimation: output decimation M (GR fir_filter_ccf decim). Currently only M=1
               is supported (a decimating complex MF overflows the last cell's
               budget); use M=1 (the coherent RX runs its loops at full rate).

  Mapped by placeKYT to ComplexRRCMatchedFilterBlock (GR fir_filter_ccf + RRC taps).

file_format: 1
