id: kyttar_complex_to_float
label: Complex To Float
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Complex To Float — splits a complex baseband stream into its two real
  rails (I and Q), a drop-in for GNU Radio's blocks.complex_to_float.

      out_re[n] = real(in[n])   (I)
      out_im[n] = imag(in[n])   (Q)

  On the Kyttar chip this is the identity datapath that de-interleaves the I/Q
  pair onto two rails so downstream REAL blocks (e.g. two Low Pass Filters in a
  Weaver SSB modem) can process each axis independently.

  This block runs on the Kyttar chip. Place it between a KyttarSource and
  KyttarSink block, and ensure the device_id matches your KyttarDevice.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.complex_to_float(device_id=${device_id})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'

inputs:
  - label: in
    dtype: complex

outputs:
  - label: re
    dtype: float
  - label: im
    dtype: float

file_format: 1
