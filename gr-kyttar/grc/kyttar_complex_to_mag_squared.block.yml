id: kyttar_complex_to_mag_squared
label: Complex to Mag^2
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Complex To Mag^2 — instantaneous power of a complex stream, a drop-in for
  GNU Radio's blocks.complex_to_mag_squared.

      out[n] = re(in[n])^2 + im(in[n])^2

  The instantaneous-power / envelope primitive (energy detectors, AGC error,
  squelch). Single cell on the Kyttar chip: MULQ re,re then MACQ im,im. SATURATION:
  the power range [0,2) overflows Q15's [0,1) for |z| >= 1, so the block saturates to
  +full-scale.

  This block runs on the Kyttar chip. Place it between a KyttarSource and KyttarSink
  block, and ensure the device_id matches your KyttarDevice.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.complex_to_mag_squared(device_id=${device_id})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'

inputs:
  - label: in
    dtype: complex

outputs:
  - label: out
    dtype: float

file_format: 1
