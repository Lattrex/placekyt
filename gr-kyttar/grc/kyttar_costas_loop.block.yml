id: kyttar_costas_loop
label: 🧪 Kyttar Costas Loop
category: '[Kyttar]'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.complex_costas_loop(${device_id}, ${loop_bw}, ${damping}, ${order})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: loop_bw
  label: Loop Bandwidth
  dtype: real
  default: '0.05'

- id: damping
  label: Damping Factor
  dtype: real
  default: '1.0'

- id: order
  label: Constellation Order
  dtype: int
  default: '2'

inputs:
- label: xi
  domain: stream
  dtype: complex

# ONE output port. GNU Radio collapses an I/Q pair into a single COMPLEX stream, so
# the recovered tap is complex at order=4 (QPSK: the on-chip qpd cell emits the
# (yi_tap, yq_tap) pair — placeKYT's importer SPLITS the single complex net into the
# two on-chip rails) and float at order=2 (BPSK: only the recovered I, yi_tap). This
# keeps the flowgraph ONE wire per complex link (no dangling second-rail port in GRC),
# exactly like kyttar_complex_rrc_matched_filter's single complex out.
outputs:
- id: '0'
  label: yi_tap
  domain: stream
  dtype: ${ 'complex' if order == 4 else 'float' }

documentation: |-
  Complex Costas Loop — decision-directed carrier recovery (= GNU Radio
  digital.costas_loop_cc). VERIFIED per-block against GNU Radio: order 2 (BPSK) and
  order 4 (QPSK) recover the SAME symbol decisions as costas_loop_cc across the
  loop_bw x frequency-offset sweep, and the on-chip build is BIT-EXACT to its
  GR-verified Q15 reference (verification/tests/test_complex_costas_loop.py).

  Takes the COMPLEX baseband (xi = in-phase, xq = quadrature) and recovers the
  carrier. The port names (xi, xq, yi_tap) and params (loop_bw, order) match GNU
  Radio digital.costas_loop_cc / the placeKYT ComplexCostasLoopBlock interface, so a
  flowgraph using this block wires up and imports into placeKYT cleanly.

  Parameters:
    Device ID: which Kyttar device to use
    Loop Bandwidth: normalized loop bandwidth (default 0.05) — GR loop_bw
    Damping Factor: loop damping (default 1.0) — Kyttar loop-shaping (derives the PI
      alpha/beta from loop_bw; damping=1.0 reproduces GR)
    Constellation Order: 2 = BPSK (default), 4 = QPSK. Matches GNU Radio
      digital.costas_loop_cc(loop_bw, order). order=2 taps the recovered I (yi_tap,
      float); order=4 runs the 2-term QPSK phase detector and taps out the recovered
      COMPLEX pair (yi_tap + yq_tap).

file_format: 1
