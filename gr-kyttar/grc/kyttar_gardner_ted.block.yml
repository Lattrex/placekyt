id: kyttar_gardner_ted
label: 🧪 Kyttar Gardner TED
category: '[Kyttar]'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.gardner_timing_recovery(${device_id}, ${kp}, ${ki}, ${complex})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: kp
  label: Proportional Gain (kp)
  dtype: int
  default: '3'

- id: ki
  label: Integral Gain (ki)
  dtype: int
  default: '1'

- id: complex
  label: Complex (I/Q)
  dtype: bool
  default: 'False'

# ONE input + ONE output port; GNU Radio carries an I/Q pair as a SINGLE complex
# stream. complex=True -> the port is COMPLEX (the on-chip block's xi/xq in and
# yi_e/yq_e out pairs; placeKYT's importer splits the single complex net into the two
# rails). complex=False (BPSK) -> the port is FLOAT (real 2-sps in, recovered center
# `out`). One wire per link keeps the flowgraph clean (no dangling second-rail port).
inputs:
- id: '0'
  label: ${ 'xi' if complex else 'x' }
  domain: stream
  dtype: ${ 'complex' if complex else 'float' }

outputs:
- id: '0'
  label: ${ 'yi_e' if complex else 'out' }
  domain: stream
  dtype: ${ 'complex' if complex else 'float' }

documentation: |-
  🧪 PROOF-OF-CONCEPT: this block works in a demo but has NOT been through
  per-block GNU Radio-equivalence verification. Use with care.

  Gardner Timing Error Detector Block

  Performs symbol timing recovery using the Gardner TED algorithm.
  Uses a multi-cell Ring pattern (3 cells) with:

  - Interpolator: Linear interpolation based on timing offset
  - TED: Computes Gardner error e = (x[n] - x[n-2]) * x[n-1]
  - Loop Filter: PI controller for timing tracking

  The Gardner TED is insensitive to carrier phase errors, making
  it ideal for use before carrier recovery or in systems where
  carrier phase is unknown.

  Parameters:
    Device ID: Which Kyttar device to use
    Proportional Gain (kp): DEPRECATED / ignored (gains derive from GR loop_bw).
    Integral Gain (ki): DEPRECATED / ignored (gains derive from GR loop_bw).
    Complex (I/Q): False = real 2-sps input -> recovered center `out` (BPSK).
      True = 2-rail I/Q timing recovery: adds the `xq` input and emits the
      recovered (yi_e, yq_e) symbol-center pair (for a downstream QPSK slicer).

  Output rate is 1/sps of input rate (symbol rate).

file_format: 1
