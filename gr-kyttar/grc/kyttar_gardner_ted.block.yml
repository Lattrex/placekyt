id: kyttar_gardner_ted
label: Kyttar Gardner TED (Symbol Sync)
category: '[Kyttar]'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.gardner_timing_recovery(${device_id}, ${loop_bw}, ${damping}, ${complex})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

# The GR symbol_sync control-loop parameters, verbatim (INV-0: mirror the GR block's
# parameter names so a user never has to learn a Kyttar-specific knob).
- id: loop_bw
  label: Loop Bandwidth
  dtype: float
  default: '0.02'

- id: damping
  label: Damping Factor
  dtype: float
  default: '1.0'

- id: complex
  label: Complex (I/Q)
  dtype: bool
  default: 'False'

# ONE input + ONE output port with FIXED names; only the DTYPE adapts to the mode.
# GNU Radio carries an I/Q pair as a SINGLE complex stream, so complex=True makes the
# ports COMPLEX (the on-chip block's xi/xq in and yi_e/yq_e out pairs — placeKYT's
# importer splits the single complex net into the two rails) and complex=False makes
# them FLOAT (real 2-sps timing recovery). A conditional dtype (not a conditional
# name) is the standard GNU Radio idiom for a mode-dependent port.
inputs:
- label: in
  domain: stream
  dtype: ${ 'complex' if complex else 'float' }

outputs:
- label: out
  domain: stream
  dtype: ${ 'complex' if complex else 'float' }

documentation: |-
  Gardner symbol-timing recovery — a drop-in for GNU Radio's
  digital.symbol_sync_cc with TED_GARDNER on the standard receiver channel
  (RRC-shaped TX, fractional timing offset, RRC matched filter, Nyquist 2
  samples/symbol).

  VERIFIED against digital.symbol_sync_cc(TED_GARDNER): BER 0 across the full
  fractional-offset sweep, on the built + simulated chip, with the on-chip stream
  bit-exact to the block's reference. See
  verification/reports/GardnerTimingRecovery.json.

  Structure (Rice Ch.8): a modulo-1 interpolator-control counter strobes ONCE per
  symbol; at that strobe both the symbol CENTER and the MID-symbol sample are
  linearly interpolated at the same fractional interval; the Gardner TED forms
  e = mid * (center - prev_center); a 2nd-order PI loop filter (gains derived from
  loop_bw + damping through GR's control_loop mapping, clamped by GR's
  max_deviation) adjusts the counter's step.

  Gardner is insensitive to carrier phase, so it can run BEFORE carrier recovery.

  Parameters:
    Device ID: Which Kyttar device to use.
    Loop Bandwidth: GR symbol_sync control-loop bandwidth (default 0.02).
      NOTE the proportional gain is a Q15 multiplier and clamps at its ceiling
      above loop_bw ~ 0.022, so a wider requested loop is not actually delivered.
    Damping Factor: GR symbol_sync control-loop damping (default 1.0).
    Complex (I/Q): False = real 2-sps input -> recovered center `out` (BPSK).
      True = 2-rail I/Q timing recovery: the I rail drives the loop and the Q rail
      is interpolated at the identical strobe, emitting the recovered
      (yi_e, yq_e) symbol-center pair for a downstream QPSK slicer.

  Output rate is 1/sps of the input rate (symbol rate).

  OPERATING POINT (measured limits, not guesses). Gain-stage the input to about
  0.7 peak: the Gardner TED is non-decision-directed, so its S-curve slope scales
  with the SQUARE of the signal level. Verified clean for peak amplitude 0.5-0.75
  and RRC rolloff beta >= 0.35. Gardner is a BPSK/QPSK detector and does NOT lock
  a 4-level (4-PAM / 16-QAM) signal — use the Kyttar M&M Timing Recovery block,
  which is decision-directed, for multilevel constellations.

file_format: 1
