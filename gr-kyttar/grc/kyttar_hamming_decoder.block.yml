id: kyttar_hamming_decoder
label: 🧪 Kyttar Hamming(7,4) Decoder
category: '[Kyttar]/FEC'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.hamming_decoder(${device_id})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

inputs:
- label: sample
  domain: stream
  dtype: byte

outputs:
- label: out
  domain: stream
  dtype: byte

documentation: |-
  🧪 Systematic Hamming(7,4) hard-decision FEC DECODER — verified on the
  placeKYT-hosted chip (no stock GNU Radio counterpart; gr-fec has no plain
  Hamming(7,4) factory — the golden is the standard textbook syndrome decoder,
  Hamming 1950 / Lin & Costello §3.3).

  Consumes 7 received bits (one 0/1 byte per item, LSB used — the
  Pack/Unpack K Bits convention), computes the 3-bit syndrome, corrects any
  SINGLE bit error via the syndrome→flip-position LUT, and emits the 4
  corrected data bits MSB-first. Rate-REDUCING 7:4; a trailing partial group
  of fewer than 7 bits is never emitted.

  THE CONVENTION (shared verbatim with the Kyttar Hamming(7,4) Encoder):
  codeword MSB-first on the wire = d3 d2 d1 d0 p2 p1 p0, data nibble
  MSB-first (d3 first), even parity with
      p2 = d3^d2^d1,  p1 = d3^d2^d0,  p0 = d3^d1^d0.

  KNOWN LIMIT (the code, not the chip): Hamming(7,4) has distance 3 — it
  corrects every single-bit error per 7-bit codeword and CANNOT correct
  double-bit errors (they decode to a wrong nibble deterministically).

  Ports:
    sample (in): received bit (byte, LSB used), 7 per codeword, MSB (d3) first
    out:         corrected data bit (byte 0/1), 4 per codeword, MSB (d3) first

  Parameters:
    Device ID: which Kyttar device to use
    (No DSP parameters — the code, the systematic layout and the bit order
    are the pinned convention above.)

  Mapped by placeKYT (File -> Import GNURadio Flowgraph) to HammingDecoderBlock.

file_format: 1
