id: kyttar_lfsr_scrambler
label: Kyttar LFSR Scrambler
category: '[Kyttar]/FEC'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.lfsr_scrambler(${device_id}, ${mask}, ${seed}, ${len}, ${count}, ${bits_per_byte})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'
- id: mask
  label: Mask (polynomial)
  dtype: int
  default: '0x8A'
- id: seed
  label: Seed
  dtype: int
  default: '0x7F'
- id: len
  label: Register length
  dtype: int
  default: '7'
- id: count
  label: Reset count (0=never)
  dtype: int
  default: '0'
- id: bits_per_byte
  label: Bits per byte
  dtype: int
  default: '1'

inputs:
- id: '0'
  label: in
  domain: stream
  dtype: byte

outputs:
- id: '0'
  label: out
  domain: stream
  dtype: byte

documentation: |-
  Additive LFSR Scrambler — GNU Radio digital.additive_scrambler_bb.

  XORs the input bit stream with the free-running output of a Fibonacci LFSR
  (gr::digital::lfsr::next_bit()):

      out    = input XOR (shift_register & 1)          # LSB is the LFSR output
      newbit = parity(shift_register & mask)           # XOR of masked bits
      shift_register = (shift_register >> 1) | (newbit << len)

  It is ADDITIVE (the LFSR runs independently of the data), so it is deterministic
  given (mask, seed, len) and self-inverse: an identically-configured block
  descrambles. BIT-EXACT-verified vs digital.additive_scrambler_bb across edge
  (all-zeros / all-ones), seed/param/count sweeps, random and mutation stimulus.

  The output bit is packed in the output word's LSB (read the raw int16, not
  Q15-scaled).

  Ports:
    in  (in):  data bit stream (0/1)
    out:       scrambled/descrambled bit (0/1 in the LSB)

  Parameters (mirror GR additive_scrambler_bb verbatim):
    Device ID:       Which Kyttar device to use.
    Mask:            Polynomial mask (feedback tap positions).
    Seed:            Initial shift-register contents.
    Register length: Feedback bit position (len). Kyttar hardware limit: <= 15
                     (the on-chip shift register is one 16-bit word).
    Reset count:     Reset the register to seed after this many bits (0 = never).
    Bits per byte:   Kyttar requires 1 (the fabric is bit-serial).

  Hardware deviations from digital.additive_scrambler_bb (INV-0):
    bits_per_byte must be 1; len must be <= 15; reset_tag_key is not supported.

  Mapped by placeKYT (File -> Import GNURadio Flowgraph) to LFSRScramblerBlock.

file_format: 1
