id: kyttar_psk_symbol_mapper
label: 🧪 Kyttar PSK Symbol Mapper
category: '[Kyttar]'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.psk_symbol_mapper(${device_id}, ${modulation}, ${symbol_table}, ${dimension}, ${bpsk_bit0_positive})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: modulation
  label: Modulation
  dtype: enum
  # BPSK maps to a REAL constellation (±1 on the I axis, Q=0) — a single real output
  # rail on-chip. QPSK/8-PSK are genuinely complex (I and Q both vary). The output port
  # dtype follows the modulation via out_type so a BPSK TX chain (upsampler/RRC/upconvert
  # all real) type-checks, while QPSK stays complex. (Hardcoding complex broke the BPSK
  # modem .grc: mapper(complex) → upsampler(real) mismatched.)
  options: ['"bpsk"', '"qpsk"', '"8psk"']
  option_labels: [BPSK, QPSK, 8-PSK]
  option_attributes:
    out_type: [complex, complex, complex]
  default: '"bpsk"'

# GR-native chunks_to_symbols params. symbol_table: an arbitrary complex
# constellation (index-in, GR digital.chunks_to_symbols). When empty, the
# modulation preset above is used (a Kyttar bit-packing extension).
- id: symbol_table
  label: Symbol table (GR-native)
  dtype: complex_vector
  default: '[]'
# GR dimension D (entries per index). Only D=1 (one complex symbol per index) is
# supported on chip; D>1 vector symbols raise.
- id: dimension
  label: Dimension
  dtype: int
  default: '1'
# BPSK constellation sign convention. True (default) = bit0->+1,bit1->-1 (GR
# chunks_to_symbols_bf([1,-1])); False = bit0->-1,bit1->+1 (constellation_bpsk),
# which chains cleanly with binary_slicer_fb for a true loopback. BPSK-only.
- id: bpsk_bit0_positive
  label: 'BPSK bit0->+1'
  dtype: bool
  default: 'True'

inputs:
- label: sample
  domain: stream
  dtype: float

outputs:
- label: out
  domain: stream
  dtype: ${ modulation.out_type }

documentation: |-
  🧪 PROOF-OF-CONCEPT: this block works in a demo but has NOT been through
  per-block GNU Radio-equivalence verification. Use with care.

  PSK Symbol Mapper — bit/index -> PSK constellation symbol.

  Maps input bits to PSK constellation symbols for BPSK, QPSK, or 8-PSK
  (Gray-coded) as used in MIL-STD-188-110B. The "modulation" preset accumulates
  1/2/3 input bits per symbol and emits the complex constellation point (I/Q).

  Ports:
    sample (in): input bit (one 0/1 word per call; 1/2/3 bits -> one symbol)
    out:         complex constellation symbol (I + jQ)

  Parameters:
    Device ID:  which Kyttar device to use
    Modulation: "bpsk" (1 bit/sym) | "qpsk" (2) | "8psk" (3); default bpsk

  Mapped by placeKYT (File -> Import GNURadio Flowgraph) to PSKSymbolMapperBlock.

file_format: 1
