id: kyttar_rrc_pulse_shaper
label: 🧪 Kyttar RRC Pulse Shaper
category: '[Kyttar]'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.rrc_pulse_shaper(${device_id}, ${alpha}, ${span})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: alpha
  label: Roll-off (alpha)
  dtype: real
  default: '0.35'

- id: span
  label: Filter Span (symbols)
  dtype: int
  default: '8'

# Stream type. The RRC shaper is a real FIR applied per rail; its GRC port dtype
# must match the chain: REAL for BPSK (interp_fir_filter_fff pulse shaping of the
# real symbol stream), COMPLEX for QPSK/8-PSK. Enum sets the dtype directly (same
# pattern as the upsampler + kyttar_source). Default float: the shipped BPSK TX
# chain carries real symbols; declaring complex here was the metadata bug behind the
# modem .grc float/complex type mismatches. (The complex matched-filter RX front end
# is a SEPARATE block, kyttar_complex_rrc_matched_filter, which stays complex.)
- id: io_type
  label: Stream Type
  dtype: enum
  default: float
  options: [float, complex]
  option_labels: ['Real (float)', 'I/Q (complex)']
  option_attributes:
    io_type: [float, complex]

inputs:
- label: sample
  domain: stream
  dtype: ${ io_type }

outputs:
- label: out
  domain: stream
  dtype: ${ io_type }

documentation: |-
  🧪 NOT YET VERIFIED: this block is queued for GNU Radio-equivalence
  verification but hasn't been validated yet. Use with care.

  Root-Raised-Cosine (RRC) Pulse Shaper / Matched Filter

  Spatial FIR filter with RRC coefficients (excess-bandwidth factor alpha).
  Used as the transmit pulse shaper or the receive matched filter. The filter
  is span*sps+1 taps (odd length, matching GNURadio), distributed across cells
  (5 taps/cell).

  Ports:
    sample (in):  upsampled symbols / received samples
    out:          pulse-shaped / matched-filtered samples

  Parameters:
    Device ID:    Which Kyttar device to use
    alpha:        Roll-off / excess bandwidth (0.2-0.5 typical; 0.35 default)
    span:         Filter span in symbols (default 8)

  Mapped by placeKYT (File -> Import GNURadio Flowgraph) to RRCPulseShaperBlock.

file_format: 1
