id: kyttar_source
label: Kyttar Source
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Source - Entry Point into Chip

  This block converts GNURadio samples to Q15 and injects them into
  the Kyttar chip. Connect your GR source to this block's input.

  Usage:
  1. Connect a GR source (e.g., audio, signal source) to the input
  2. Connect the output to a Kyttar DSP block (gain, filter, etc.)
  3. Ensure device_id matches your KyttarDevice block
  4. Select the input port on the chip (x16_in, x1_in)

  Multi-Channel Mode (num_channels > 1):
  For I/Q or multi-channel processing, set num_channels to 2 or 3.
  The input is expected to be interleaved (I, Q, I, Q...) and each
  sample is tagged with a channel-specific entry address:
    - Channel 0 (I): Entry R1
    - Channel 1 (Q): Entry R11
    - Channel 2:     Entry R21

  A Kyttar Demux block can then route each channel to different
  processing paths within the chip.

  SERVER-BATCH MODE (Server Port > 0): drive a placeKYT-hosted chip (Simulation ->
  Run as GNURadio Server) via ONE process_batch RPC. The input is the whole complex
  I/Q burst (set Complex Input = Yes); the matching Kyttar Sink (same Device ID)
  emits the recovered words. This is the GRC-first workflow: keep the REAL DSP
  blocks in the graph (so placeKYT can IMPORT + place them) AND run the same graph
  linked to the hosted chip. Set Burst length to the number of complex samples.

  Parameters:
  - Device ID: ID of the KyttarDevice block (must match the Sink)
  - Port Name: Chip input port to use
  - Num Channels: 1=simple, 2=I/Q, 3=tri-channel
  - Server Host / Server Port: the placeKYT SimServer endpoint (0 = local mode)
  - Complex Input: Yes for an I/Q (coherent) burst in server mode
  - Burst length: complex-sample count to batch (0 = flush at stop)
  - Full-speed (saturated): how the burst is PACED into the chip.
    * No (per-sample): one sample injected, run to quiescence, next sample — a
      data-flow view for stepping/animation. Rate is dominated by host round-trips,
      NOT the chip; do NOT read throughput from this mode.
    * Yes (pipelined): the WHOLE burst is queued back-to-back and the input port
      self-paces (each word waits only until the input cell accepts the prior).
      This is the chip's real saturated throughput — the number the Stream Summary
      "Settled rate" reports and what the README Performance tables quote.
  - Duplex schedule: how a two-stream (TX+RX) duplex design drives the shared
    input port.
    * Sequential (simplex): each direction's WHOLE burst runs ALONE on the array,
      one at a time. Each chain hits its own compute-bound ceiling with no
      contention — the PEAK per-chain rate. This is what the README simplex
      numbers report.
    * Interleaved (full-duplex): TX + RX words are merged on the shared input port
      and both chains run co-resident, time-slicing the one corridor. The honest
      sustained full-duplex rate (contention-dependent, generally below simplex).
    Settable before Run; the .kyt design is untouched. Ignored without a Stream ID.

  REPRODUCING THE README PERFORMANCE NUMBERS (simplex):
    open the shipped .kyt → Run as GNURadio Server → in the .grc set
    Full-speed (saturated) = Yes and Duplex schedule = Sequential → Run →
    read each direction's "Settled rate" in the Stream Summary panel. For the
    full-duplex figure instead, set Duplex schedule = Interleaved.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.source(device_id=${device_id}, port_name=${port_name},
    num_channels=${num_channels}, server_host=${server_host},
    server_port=${server_port}, complex_in=${complex_in.make_val}, burst_len=${burst_len},
    stream_id=${stream_id}, pipelined=${pipelined.make_val},
    schedule=${schedule})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'
  - id: port_name
    label: Port Name
    dtype: string
    default: '"x16_in"'
    options: ['"x16_in"', '"x1_in"']
    option_labels: ['x16 (16-bit)', 'x1 (1-bit)']
  - id: num_channels
    label: Num Channels
    dtype: int
    default: '1'
    options: ['1', '2', '3']
    option_labels: ['1 (Simple)', '2 (I/Q)', '3 (Tri-Channel)']
  - id: server_host
    label: Server Host
    dtype: string
    default: '"127.0.0.1"'
  - id: server_port
    label: Server Port
    dtype: int
    default: '0'
  # Input stream type. An ENUM (not a bool) so the GRC stream dtype is set
  # DIRECTLY from the selected option's io_type attribute — no boolean-truthiness
  # ambiguity (a GRC bool param evaluates to the string 'False', which is truthy,
  # which forced complex and broke float demos). `make_val` is the matching value
  # passed to the Python block's complex_in= argument.
  - id: complex_in
    label: Input Type
    dtype: enum
    default: float
    options: [float, complex]
    option_labels: ['Real (float)', 'I/Q (complex)']
    option_attributes:
      io_type: [float, complex]
      make_val: ['False', 'True']
  - id: burst_len
    label: Burst length
    dtype: int
    default: '0'
  # SHARED-INPUT-PORT DUPLEX: when two sources feed ONE chip input port (the
  # full-duplex modem: TX bits AND RX I/Q both off x16_in), name a distinct
  # stream for each ('tx'/'rx'). The placeKYT importer copies this onto the
  # x16_in→block net so the server resolves each burst to its own block's
  # entry/hop/data-registers and demuxes its words by tag. Empty ⇒ single-stream.
  - id: stream_id
    label: Stream ID
    dtype: string
    default: ''
  # FULL-SPEED (SATURATED) DRIVE: when Yes, the whole burst is queued and run to
  # completion on the hosted chip in ONE saturated pass (back-to-back words, no
  # per-sample quiescence) — the device's real throughput. Requires a saturation-
  # safe chip design (point-to-point-routed, no bus congestion): the coherent BPSK
  # RX .kyt is proven to decode BER 0 this way. Leave No for per-sample drive (the
  # lightweight demos). Enum (not bool) for the same GRC-truthiness reason as above.
  - id: pipelined
    label: Full-speed (saturated)
    dtype: enum
    default: 'no'
    options: ['no', 'yes']
    option_labels: ['No (per-sample)', 'Yes (pipelined)']
    option_attributes:
      make_val: ['False', 'True']
  # SCHEDULE (timing-analysis knob, no design change): how the TWO duplex streams
  # (TX + RX sharing one x16_in port) are driven on the chip. GRC-settable BEFORE
  # Run — flip it and re-Run to compare timing with NO edit to the .kyt. Under the
  # saturated drive BOTH run at the SAME array rate (~146 kSa/s RX on the 16-QAM
  # modem): a shared input PORT serializes the corridor, it does NOT halve the
  # array's compute, so full-duplex costs NO throughput vs simplex.
  #   Interleaved (full-duplex): TX + RX words merged on the shared port, both chains
  #     co-resident — the honest steady-state full-duplex condition (TX and RX drain
  #     together in the same window).
  #   Sequential (simplex): each direction's WHOLE burst runs alone before the other
  #     (one direction on the array at a time) — a per-direction timing baseline.
  # Only meaningful with a Stream ID (duplex); a single-stream source ignores it.
  # Set it on either duplex source (or both) — the rendezvous takes the non-default.
  - id: schedule
    label: Duplex schedule
    dtype: enum
    default: '"interleaved"'
    options: ['"interleaved"', '"sequential"']
    option_labels: ['Interleaved (full-duplex)', 'Sequential (simplex)']

inputs:
  - label: in
    domain: stream
    # Set directly from the Input Type enum's io_type attribute (float/complex).
    dtype: ${ complex_in.io_type }

outputs:
  - label: out
    domain: stream
    # The output MIRRORS the input type (single-complex model): a complex (I/Q)
    # source emits a complex baseband stream into the complex DSP markers (matched
    # filter, Costas), a real (float) source emits float (e.g. the TX bit into the
    # PSK mapper). This matches source.py's out_dtype = in_dtype. The GR stream is
    # cosmetic in server-batch mode (the burst travels via the batch RPC), but its
    # TYPE must equal the downstream marker's port type or GRC reports a mismatch.
    dtype: ${ complex_in.io_type }

file_format: 1
