id: kyttar_splitter
label: Splitter
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Splitter — an explicit stream fan-out relay (out = in on every arm).

  GNU Radio fans a port out natively; on the Kyttar chip every extra arm costs
  the SOURCE cell exit words, and tightly-authored cells (e.g. Gain: 3 exit
  words) cannot hold more than their wired arms. This near-empty 1-cell relay
  reserves a fan-out tail for up to 8 arms — wire its single output to as many
  consumers as needed (splitters chain into trees for wider fan-outs).

  The placeKYT importer also auto-splices one wherever a flowgraph fans a
  single-rail block output to two or more different blocks (or three or more
  inputs) — place this block explicitly to control where the fan-out cell
  sits.

  The relay is exact (no Q15 arithmetic) and memoryless (delay 0).

  This block runs on the Kyttar chip. Place it between a KyttarSource and
  KyttarSink block, and ensure the device_id matches your KyttarDevice.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.splitter(device_id=${device_id})

parameters:
  - id: device_id
    label: Device ID
    dtype: string
    default: '"kyttar_0"'

inputs:
  - label: in
    dtype: float

outputs:
  - label: out
    dtype: float

file_format: 1
