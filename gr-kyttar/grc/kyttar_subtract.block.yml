id: kyttar_subtract
label: Kyttar Subtract
category: '[Kyttar]'
flags: [ python ]

documentation: |-
  Kyttar Subtract — difference of N real streams (drop-in for GNU Radio's
  blocks.sub_ff). out = in0 - in1 - … - in(N-1).

  On the Kyttar chip this maps to SubtractBlock (a chain of saturating Q15
  subtracts). Place it between a KyttarSource and KyttarSink and ensure the
  device_id matches your KyttarDevice. Used e.g. for the I·cos − Q·sin combine
  of an SSB Weaver upconverter.

templates:
  imports: from gnuradio import kyttar
  make: kyttar.subtract(device_id=${device_id}, num_inputs=${num_inputs})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'
- id: num_inputs
  label: Num Inputs
  dtype: int
  default: '2'

inputs:
- label: in
  domain: stream
  dtype: float
  multiplicity: ${ num_inputs }

outputs:
- label: out
  domain: stream
  dtype: float

asserts:
- ${ 2 <= num_inputs }

file_format: 1
