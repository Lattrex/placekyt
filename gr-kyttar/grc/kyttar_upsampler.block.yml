id: kyttar_upsampler
label: 🧪 Kyttar Upsampler
category: '[Kyttar]'

templates:
  imports: from gnuradio import kyttar
  make: kyttar.upsampler(${device_id}, ${sps})

parameters:
- id: device_id
  label: Device ID
  dtype: string
  default: '"kyttar_0"'

- id: sps
  label: Samples/Symbol (sps)
  dtype: int
  default: '4'

# Stream type. The upsampler is a dtype-AGNOSTIC zero-stuffer (it just repeats a
# sample then inserts sps-1 zeros), so its GRC port dtype must match how the chain
# uses it: REAL for a BPSK symbol stream (mapper emits I only, Q=0), COMPLEX for
# QPSK/8-PSK (true I/Q symbols). An enum (not a bool) sets the port dtype directly
# from io_type — same pattern as kyttar_source's Input Type. Default float: the
# BPSK TX chain (the shipped demo) carries real symbols, and declaring complex here
# was the metadata bug that made the modem .grc raise float/complex type mismatches.
- id: io_type
  label: Stream Type
  dtype: enum
  default: float
  options: [float, complex]
  option_labels: ['Real (float)', 'I/Q (complex)']
  option_attributes:
    io_type: [float, complex]

inputs:
- label: x
  domain: stream
  dtype: ${ io_type }

outputs:
- label: out
  domain: stream
  dtype: ${ io_type }

asserts:
- ${ 1 <= sps <= 8 }

documentation: |-
  🧪 PROOF-OF-CONCEPT: this block works in a demo but has NOT been through
  per-block GNU Radio-equivalence verification. Use with care.

  Upsampler — zero-stuffing rate expander (front half of an interpolating filter).

  On each input sample it emits sps outputs: the sample itself followed by sps-1
  ZEROS. Feed its output to the RRC Pulse Shaper and the pair is GNU Radio's
  filter.interp_fir_filter_fff(sps, rrc_taps). Sits between the symbol mapper and
  the RRC in the TX chain. Rate-EXPANDING: one input -> sps outputs.

  Ports:
    x (in):  symbol-rate samples
    out:     upsampled stream (sample, then sps-1 zeros)

  Parameters:
    Device ID: which Kyttar device to use
    sps:       samples per symbol / interpolation factor (1-8; default 4)

  Mapped by placeKYT (File -> Import GNURadio Flowgraph) to UpsamplerBlock.

file_format: 1
